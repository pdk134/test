name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, master]   # github-pages 环境只允许默认分支部署，其他分支推送不触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 组装待发布的站点：根路径放学习通 App，/period-tracker/ 放经期小助手
      # App 目录正从 MYAPP/ 迁移到 archgo/，这里两个都兼容；都没有则直接失败，
      # 避免静默部署出一个空站（曾经踩过：目录改名后站点构建成空白页）
      - name: Assemble site
        run: |
          mkdir -p site
          if [ -d archgo ]; then
            cp -r archgo/. site/
            echo "App 源目录: archgo/"
          elif [ -d MYAPP ]; then
            cp -r MYAPP/. site/
            echo "App 源目录: MYAPP/"
          else
            echo "::error::未找到 App 源目录（archgo/ 或 MYAPP/），中止部署"
            exit 1
          fi
          if [ -d period-tracker ]; then
            mkdir -p site/period-tracker
            cp -r period-tracker/. site/period-tracker/
          fi
          echo "已组装待发布内容："
          find site -maxdepth 2 -type f | sort

      # 环境切换：仅在构建默认分支时，把 config.js 里的 SUPABASE_ENV 由 'dev' 换成 'prod'。
      # 这样日常开发只需保持 'dev'（默认值），合到 main 发布时由流水线自动切生产，
      # 不需要任何人手动改配置，也就不会出现「忘了改 → 生产数据写进开发库」。
      # 替换失败必须中止构建：宁可发不出去，也不能发一个连着开发库的生产站。
      - name: Switch site to production Supabase
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          CFG=site/assets/js/config.js
          if [ ! -f "$CFG" ]; then
            echo "::error::找不到 $CFG，环境切换中止"
            exit 1
          fi
          cp "$CFG" /tmp/config.js.bak
          sed -i -E "s|window\.SUPABASE_ENV[[:space:]]*=[[:space:]]*'[a-zA-Z]+'|window.SUPABASE_ENV = 'prod'|" "$CFG"
          if ! grep -q "window.SUPABASE_ENV = 'prod'" "$CFG"; then
            echo "::error::环境切换失败，config.js 中 SUPABASE_ENV 的写法与替换脚本不匹配"
            echo "--- 当前内容 ---"
            grep -n "SUPABASE_ENV" "$CFG" || echo "(未找到 SUPABASE_ENV 这一行)"
            cp /tmp/config.js.bak "$CFG"
            exit 1
          fi
          echo "环境已切换为 prod，当前生效项目："
          grep -oE "https://[a-z0-9]+\.supabase\.co" "$CFG" | sort -u

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
