name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, master]   # github-pages 环境只允许默认分支部署，其他分支推送不触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 组装待发布的站点：根路径放 MYAPP，/period-tracker/ 放经期小助手
      - name: Assemble site
        run: |
          mkdir -p site
          if [ -d MYAPP ]; then cp -r MYAPP/. site/; fi
          if [ -d period-tracker ]; then
            mkdir -p site/period-tracker
            cp -r period-tracker/. site/period-tracker/
          fi
          echo "已组装待发布内容："
          find site -maxdepth 2 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
