name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, master]   # github-pages 环境只允许默认分支部署，其他分支推送不触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 组装待发布的站点：根路径放学习通 App，/period-tracker/ 放经期小助手
      # App 目录正从 MYAPP/ 迁移到 archgo/，这里两个都兼容；都没有则直接失败，
      # 避免静默部署出一个空站（曾经踩过：目录改名后站点构建成空白页）
      - name: Assemble site
        run: |
          mkdir -p site
          if [ -d archgo ]; then
            cp -r archgo/. site/
            echo "App 源目录: archgo/"
          elif [ -d MYAPP ]; then
            cp -r MYAPP/. site/
            echo "App 源目录: MYAPP/"
          else
            echo "::error::未找到 App 源目录（archgo/ 或 MYAPP/），中止部署"
            exit 1
          fi
          if [ -d period-tracker ]; then
            mkdir -p site/period-tracker
            cp -r period-tracker/. site/period-tracker/
          fi
          echo "已组装待发布内容："
          find site -maxdepth 2 -type f | sort

      # 环境选择 + 精简产物：
      #   1. 默认分支用 prod，其余一律 dev（宁可线上连开发库，也不能把生产数据写进开发库）
      #   2. 把 SUPABASE_ENV 切到选中环境
      #   3. 删掉未启用那一套配置，避免把另一个项目的 URL 与 anon key 一起发到线上
      # 任一步校验不过就中止构建并回滚 config.js：宁可发不出去，也不发一个配置错乱的站点。
      - name: Select Supabase environment
        run: |
          CFG=site/assets/js/config.js
          if [ ! -f "$CFG" ]; then
            echo "::error::找不到 $CFG，环境选择中止"
            exit 1
          fi
          cp "$CFG" /tmp/config.js.bak

          if [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_REF" = "refs/heads/master" ]; then
            ENV=prod
          else
            ENV=dev
          fi
          OTHER=dev; [ "$ENV" = "dev" ] && OTHER=prod

          sed -i -E "s|window\.SUPABASE_ENV[[:space:]]*=[[:space:]]*'[a-zA-Z]+'|window.SUPABASE_ENV = '$ENV'|" "$CFG"
          if ! grep -q "window.SUPABASE_ENV = '$ENV'" "$CFG"; then
            echo "::error::SUPABASE_ENV 替换失败，config.js 写法与脚本不匹配"
            grep -n "SUPABASE_ENV" "$CFG" || echo "(未找到 SUPABASE_ENV 这一行)"
            cp /tmp/config.js.bak "$CFG"; exit 1
          fi

          sed -i -E "/^  $OTHER: \{/,/^  \}/d" "$CFG"
          if grep -qE "^  $OTHER: \{" "$CFG"; then
            echo "::error::$OTHER 配置块未能从产物中清除（缩进/格式与脚本不匹配）"
            cp /tmp/config.js.bak "$CFG"; exit 1
          fi
          # 兜底：产物里不允许残留另一个项目的地址
          if [ "$ENV" = "prod" ] && grep -q "jyytfphsldxmmxqltqvp" "$CFG"; then
            echo "::error::产物中仍残留开发项目信息，发布中止"
            cp /tmp/config.js.bak "$CFG"; exit 1
          fi
          if [ "$ENV" = "dev" ] && grep -q "wyuhxtnchkndkrsfknlh" "$CFG"; then
            echo "::error::产物中仍残留生产项目信息，发布中止"
            cp /tmp/config.js.bak "$CFG"; exit 1
          fi

          echo "环境：$ENV（已移除 $OTHER）"
          grep -oE "https://[a-z0-9]+\.supabase\.co" "$CFG" | sort -u

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
