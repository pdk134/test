<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>横版格斗 · 悟空篇</title>
<style>
  html,body{margin:0;height:100%;background:#1a1a22;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-family:"Microsoft YaHei",sans-serif;color:#eee}
  #wrap{position:relative}
  canvas{background:#101018;border:2px solid #444;border-radius:8px;box-shadow:0 10px 40px #000}
  #tip{margin-top:10px;font-size:13px;color:#9aa;line-height:1.6;text-align:center}
  kbd{background:#333;padding:1px 7px;border-radius:4px;border:1px solid #555;font-family:monospace}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="960" height="540"></canvas>
</div>
<div id="tip">
  <kbd>A</kbd>/<kbd>D</kbd> 移动 &nbsp; <kbd>W</kbd> 跳跃 &nbsp; <kbd>J</kbd> 拳 &nbsp; <kbd>K</kbd> 脚 &nbsp; <kbd>R</kbd> 重开<br>
  击败每一波敌人即可进入下一波，撑到通关或倒下为止。
</div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const GROUND = H - 60;
const GRAV = 0.8;

// ---------- 输入 ----------
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'r') reset(); });
addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });

// ---------- 角色 ----------
function makeFighter(x, isPlayer, color){
  return { x, y: GROUND, vx:0, vy:0, w:40, h:80, facing: isPlayer?1:-1,
    hp:100, maxhp:100, isPlayer, color, onGround:true,
    atk:0, atkType:null, atkCd:0, hitCd:0, knock:0, dead:false, aiTimer:0 };
}

let player, enemies, wave, score, state, camX;

function reset(){
  player = makeFighter(120, true, '#ffcf4d');
  enemies = [];
  wave = 1; score = 0; state = 'play'; camX = 0;
  spawnWave();
}
function spawnWave(){
  const n = Math.min(2 + wave, 5);
  for (let i=0;i<n;i++)
    enemies.push(makeFighter(700 + i*110 + Math.random()*60, false, '#e0564b'));
}

// ---------- 攻击命中 ----------
function tryHit(a, b){
  if (a.atk <= 0 || a.hitCd > 0 || b.dead) return;
  const reach = a.atkType==='kick' ? 70 : 55;
  const dx = b.x - a.x;
  if (Math.sign(dx) === a.facing && Math.abs(dx) < reach && Math.abs(b.y - a.y) < 80){
    const dmg = a.atkType==='kick' ? 12 : 8;
    b.hp -= dmg; b.knock = a.facing * (a.atkType==='kick'?9:6);
    b.hitCd = 25; a.hitCd = 20;
    if (b.hp <= 0){ b.dead = true; if(!b.isPlayer) score += 50; }
  }
}

// ---------- 更新 ----------
function update(){
  if (state !== 'play') return;

  // 玩家
  const p = player;
  if (!p.dead){
    p.vx = 0;
    if (keys['a']) { p.vx = -4; p.facing = -1; }
    if (keys['d']) { p.vx =  4; p.facing =  1; }
    if ((keys['w']||keys[' ']) && p.onGround){ p.vy = -14; p.onGround=false; }
    if (keys['j'] && p.atkCd<=0){ p.atk = 16; p.atkType='punch'; p.atkCd=22; }
    if (keys['k'] && p.atkCd<=0){ p.atk = 22; p.atkType='kick'; p.atkCd=30; }
    enemies.forEach(e => tryHit(p, e));
  }

  // 敌人 AI
  enemies.forEach(e=>{
    if (e.dead) return;
    e.aiTimer++;
    const dx = p.x - e.x;
    if (p.dead || e.hp < 30 && Math.random()<0.02){ // 残血偶尔后撤
      e.vx = -e.facing*2;
    } else if (Math.abs(dx) > 60){
      e.vx = Math.sign(dx)*2.6; e.facing = Math.sign(dx);
    } else {
      e.vx = 0;
      if (e.atkCd<=0 && e.aiTimer%20===0){ e.atk=18; e.atkType='punch'; e.atkCd=40; }
    }
    tryHit(e, p);
  });

  // 物理
  [p, ...enemies].forEach(o=>{
    o.x += o.vx + (o.knock||0); o.knock *= 0.8; if(Math.abs(o.knock)<0.3)o.knock=0;
    o.vy += GRAV; o.y += o.vy;
    if (o.y >= GROUND){ o.y = GROUND; o.vy=0; o.onGround=true; }
    o.x = Math.max(0, Math.min(o.x, 4000));
    if (o.atk>0) o.atk--; if (o.atkCd>0) o.atkCd--; if (o.hitCd>0) o.hitCd--;
  });

  // 胜负
  if (p.hp <= 0){ p.dead = true; state='lose'; }
  if (enemies.length && enemies.every(e=>e.dead)){
    if (wave >= 5){ state='win'; }
    else { wave++; spawnWave(); }
  }

  // 镜头
  camX = Math.max(0, Math.min(p.x - W/3, 4000 - W));
}

// ---------- 绘制 ----------
function drawFighter(o){
  if (o.dead) return;
  const x = o.x - camX, y = o.y;
  ctx.save();
  ctx.fillStyle = o.color;
  // 身体
  ctx.fillRect(x - o.w/2, y - o.h, o.w, o.h);
  // 头
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x, y - o.h - 12, 14, 0, 7); ctx.fill();
  // 攻击伸展
  if (o.atk > 0){
    ctx.fillStyle = o.atkType==='kick' ? '#ff7' : '#fda';
    const ext = o.atkType==='kick'? 55:40;
    ctx.fillRect(o.facing>0 ? x+o.w/2 : x-o.w/2-ext,
                 o.atkType==='kick'? y-30 : y-50, ext, 12);
  }
  ctx.restore();
}
function bar(x,y,w,hp,max,c){
  ctx.fillStyle='#400'; ctx.fillRect(x,y,w,10);
  ctx.fillStyle=c; ctx.fillRect(x,y,w*Math.max(0,hp)/max,10);
}
function render(){
  ctx.clearRect(0,0,W,H);
  // 背景（视差）
  ctx.fillStyle='#1b2030'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#262d44';
  for(let i=0;i<20;i++){ const bx = (i*180 - camX*0.5)% (W+200);
    ctx.fillRect((bx+W)% (W+200)-100, 120, 90, H-180); }
  ctx.fillStyle='#2e6b3a'; ctx.fillRect(0, GROUND, W, H-GROUND); // 地面

  enemies.forEach(drawFighter);
  drawFighter(player);

  // HUD
  bar(20,20,260,player.hp,player.maxhp,'#5d5');
  ctx.fillStyle='#fff'; ctx.font='14px sans-serif';
  ctx.fillText('悟空 HP', 20, 16);
  ctx.fillText('波次 '+wave+'/5   得分 '+score, W-220, 16);
  const alive = enemies.filter(e=>!e.dead).length;
  ctx.fillText('剩余敌人 '+alive, W-220, 36);

  if (state==='lose'){ overlay('败北…','按 R 重来'); }
  if (state==='win'){ overlay('通关！','按 R 再战'); }
}
function overlay(t1,t2){
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffcf4d'; ctx.font='48px sans-serif';
  ctx.fillText(t1, W/2-ctx.measureText(t1).width/2, H/2);
  ctx.fillStyle='#fff'; ctx.font='20px sans-serif';
  ctx.fillText(t2, W/2-ctx.measureText(t2).width/2, H/2+44);
}

function loop(){ update(); render(); requestAnimationFrame(loop); }
reset(); loop();
</script>
</body>
</html>
